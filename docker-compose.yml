# 로컬 개발 스택. 호스트 포트가 점유돼 있으면 *_HOST_PORT 환경변수로 덮어쓴다.
# 예: MINIO_HOST_PORT=9100 MINIO_CONSOLE_HOST_PORT=9101 make docker-up

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hitl
      POSTGRES_PASSWORD: hitl
      POSTGRES_DB: hitl
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitl -d hitl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Coding Agent 워커 이미지 (빌드만; 실행은 Scheduler의 DockerCliLauncher가 `docker run`)
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: foreman-worker:dev
    profiles: ["worker"]
    environment:
      WORKER_TIMEOUT_MIN: "45"
      WORKER_LLM_PROVIDER: "${WORKER_LLM_PROVIDER:-openai_compat}"
      WORKER_LLM_BASE_URL: "${WORKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}"
      WORKER_LLM_MODEL: "${WORKER_LLM_MODEL:-qwen2.5-coder:7b}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
  minio_data:
