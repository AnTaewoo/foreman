[project]
name = "foreman"
version = "0.1.0"
description = "HITL multi-agent dev platform: repo + goal -> AI agent team -> issues/PRs, humans approve risky decisions"
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langchain-core",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "pygithub",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-ulid",
    "structlog",
    "pyjwt[crypto]",
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
    "pre-commit",
    "pyyaml",
    "types-pyyaml",
    "aiosqlite",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["control_plane", "agents", "github_adapter", "worker"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]
ignore = []

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# LLM provider SDK는 agents/llm/anthropic.py 어댑터에서만 import (CLAUDE.md, D-23)
"anthropic" = { msg = "Import the provider SDK only in agents/llm/anthropic.py; use ModelProvider." }

[tool.ruff.lint.per-file-ignores]
"agents/llm/anthropic.py" = ["TID251"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "control_plane.*"
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv", "node_modules", ".git"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Docker (Postgres/Redis/worker); excluded from `make test`",
]
addopts = "-m 'not integration'"
