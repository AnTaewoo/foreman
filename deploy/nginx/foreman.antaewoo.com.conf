# 참고용 (P9.4) — nginx 사이트 파일은 사용자가 /etc/nginx/sites-available/ 에 직접 만든다.
# 골격은 기존 blog 사이트와 같다: 80은 ACME 챌린지 + 301, 443은 127.0.0.1:8000 프록시(+WS 업그레이드).
server {
    listen 80;
    server_name foreman.antaewoo.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }   # 기존 사이트의 webroot와 동일하게
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name foreman.antaewoo.com;
    ssl_certificate     /etc/letsencrypt/live/antaewoo.com/fullchain.pem;   # certbot --expand 로 foreman 추가 후
    ssl_certificate_key /etc/letsencrypt/live/antaewoo.com/privkey.pem;

    client_max_body_size 2m;
    add_header X-Robots-Tag "noindex" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;        # WS /projects/{id}/stream
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # 레이트리밋 IP (uvicorn --proxy-headers)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                      # WS 유지
        proxy_send_timeout 3600s;
    }
}
