# uv 환경의 도구를 그대로 쓰는 local hooks. `uv run pre-commit install`로 설치.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy control_plane agents github_adapter worker
        language: system
        pass_filenames: false
        types: [python]
