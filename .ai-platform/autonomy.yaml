# 샘플 정책 파일 (설계 §8.3). MVP 1에서는 파싱만 하고 Policy Engine은 없다.
version: 1

autonomy:                # T0/T1로 취급할 작업 kind
  implementation: auto
  tests: auto
  bug_fix: auto
  refactoring: auto
  docs: auto

approval_required:       # 승인 quorum
  dependency:    { count: 1 }
  database:      { count: 1, roles: [owner, approver] }
  api_contract:  { count: 1 }
  architecture:  { count: 2, roles: [owner] }
  security:      { count: 2 }
  production:    { count: 2, roles: [owner] }
  cost:          { count: 1 }

decision_sla:
  default_hours: 24
  on_expire: notify        # notify | auto_reject | escalate

budget:
  daily_usd: 30
  total_usd: 500
  warn_at: 0.8
  on_exceed: pause         # pause | continue_t0_only

concurrency:
  max_workers: 4
  max_coding_agents: 3

protected_paths:
  - "infra/prod/**"
  - "src/auth/**"

merge:
  strategy: squash
  require_ci: true
  require_agent_review: true

models:
  default:   { provider: anthropic, model: claude-opus-5 }
  architect: { provider: anthropic, model: claude-opus-5 }
  review:    { provider: anthropic, model: claude-opus-5 }
